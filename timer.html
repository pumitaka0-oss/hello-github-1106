<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5ee" />
    <title>シンプルタイマー | 茂野 流星</title>
    <link rel="stylesheet" href="timer.css" />
    <script src="timer.js" defer></script>
  </head>
  <body>
    <main class="timer-app">
      <a class="back" href="index.html">← ホームへ戻る</a>
      <p class="eyebrow">A LITTLE FOCUS TIME</p>
      <h1>シンプルタイマー</h1>
      <p class="intro">時間を決めて、ひとつずつ。</p>
      <section class="timer-card" aria-label="タイマー">
        <div class="time" id="time" role="timer" aria-live="off">05:00</div>
        <div class="inputs" aria-label="時間を設定">
          <label>分 <input id="minutes" type="number" min="0" max="99" value="5" inputmode="numeric"></label>
          <span>:</span>
          <label>秒 <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric"></label>
        </div>
        <div class="buttons">
          <button id="start" class="primary" type="button">スタート</button>
          <button id="reset" type="button">リセット</button>
        </div>
        <p id="message" class="message" aria-live="polite">時間を設定してスタート</p>
      </section>
      <p class="tip">分と秒を入力して、スタートを押してください。</p>
    </main>
  </body>
</html>
